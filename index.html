<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        /* 马卡龙色系定义 */
        :root {
            --bg-color: #fffaf0;
            --card-bg: #ffffff;
            --primary-pink: #ffadad;
            --primary-blue: #a0c4ff;
            --primary-yellow: #fdffb6;
            --primary-green: #caffbf;
            --text-color: #6d6d6d;
        }

        body {
            font-family: 'PingFang SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            touch-action: pan-y; /* 允许垂直滚动 */
        }

        #app {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { color: var(--primary-pink); font-size: 24px; margin-bottom: 10px; }

        /* 价格筛选器样式 */
        .filter-box {
            width: 100%;
            background: #fff;
            padding: 15px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        input[type=range] { width: 80%; accent-color: var(--primary-pink); }

            width: 300px;
            height: 350px;
            position: relative;
            margin: 20px 0;
        }
