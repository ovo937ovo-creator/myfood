<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎀 今天吃什么 🎀</title>
    <style>
        :root {
            --bg-color: #fffaf0;
            --card-bg: #ffffff;
            --primary-pink: #ffadad;
            --primary-blue: #a0c4ff;
            --primary-yellow: #fdffb6;
            --text-color: #6d6d6d;
        }

        body {
            font-family: 'PingFang SC', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        #app {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            text-align: center;
            display: block !important; /* 确保可见 */
        }

        h1 { color: var(--primary-pink); font-size: 24px; }

        .filter-box {
            background: #fff;
            padding: 15px;
            border-radius: 25px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .card-container {
            width: 100%;
            height: 300px;
            position: relative;
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .food-card {
            width: 280px;
            height: 100%;
            background: var(--card-bg);
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: absolute;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border: 6px solid var(--primary-yellow);
            z-index: 10;
        }

        .input-area {
            background: #fff;
            border-radius: 30px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 15px;
            border: 1px solid #eee;
            box-sizing: border-box;
        }

        .btn {
            border: none;
            border-radius: 20px;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin: 10px 0;
        }
        .btn-main { background: var(--primary-pink); color: white; font-size: 18px; }
        .btn-add { background: var(--primary-blue); color: white; }
    </style>
</head>
<body>

<div id="app">
    <h1>🎀 今天吃什么 🎀</h1>

    <div class="filter-box">
        预算：<span id="priceLabel">50</span> 元以内
        <input type="range" id="priceRange" min="10" max="200" step="5" value="50" style="width:100%" oninput="document.getElementById('priceLabel').innerText=this.value">
    </div>

    <button class="btn btn-main" onclick="initCard()">开始随机抽取</button>

    <div class="card-container" id="container">
        <div id="emptyTip" style="color:#ccc;">👈 下方先录入店名哦</div>
    </div>

    <div class="input-area">
        <h3 style="margin:0">🍭 录入美食</h3>
        <input type="text" id="inStore" placeholder="店名">
        <input type="text" id="inDish" placeholder="推荐菜">
        <input type="number" id="inPrice" placeholder="人均价格">
        <input type="text" id="inLoc" placeholder="地图链接或位置">
        <button class="btn btn-add" onclick="addFood()">存入我的清单</button>
    </div>
</div>

<script>
    let myFoods = JSON.parse(localStorage.getItem('foodData')) || [];
    let startX = 0;

    function initCard() {
        const maxPrice = parseInt(document.getElementById('priceRange').value);
        const filtered = myFoods.filter(f => f.price <= maxPrice);
        if (filtered.length === 0) return alert("没找到符合预算的店，请先录入或调高预算");
        const food = filtered[Math.floor(Math.random() * filtered.length)];
        renderCard(food);
    }

    function renderCard(food) {
        const container = document.getElementById('container');
        container.innerHTML = '';
        const card = document.createElement('div');
        card.className = 'food-card';
        card.innerHTML = `<h2>${food.name}</h2><p>${food.dish}</p><h3 style="color:#ffafbd">￥${food.price}</h3><p style="font-size:12px;color:#ccc">⬅️换一个 | 看位置➡️</p>`;
        
        card.ontouchstart = (e) => { startX = e.touches[0].clientX; card.style.transition = 'none'; };
        card.ontouchmove = (e) => { 
            let moveX = e.touches[0].clientX - startX;
            card.style.transform = `translateX(${moveX}px) rotate(${moveX/10}deg)`;
        };
        card.ontouchend = (e) => {
            let moveX = e.changedTouches[0].clientX - startX;
            card.style.transition = '0.3s';
            if (Math.abs(moveX) > 100) {
                card.style.transform = `translateX(${moveX > 0 ? 500 : -500}px) rotate(${moveX/10}deg)`;
                setTimeout(() => {
                    if(moveX > 0) {
                        if(food.loc.includes('http')) window.open(food.loc);
                        else alert("位置：" + food.loc);
                    }
                    initCard();
                }, 200);
            } else {
                card.style.transform = 'translateX(0) rotate(0)';
            }
        };
        container.appendChild(card);
    }

    function addFood() {
        const name = document.getElementById('inStore').value;
        const price = document.getElementById('inPrice').value;
        const dish = document.getElementById('inDish').value || "好吃的";
        const loc = document.getElementById('inLoc').value || "附近";
        if (!name || !price) return alert("名字和价格都要填哦");
        myFoods.push({ name, dish, price: parseInt(price), loc });
        localStorage.setItem('foodData', JSON.stringify(myFoods));
        alert("存好啦！");
        document.getElementById('inStore').value = '';
        document.getElementById('inPrice').value = '';
    }
</script>

</body>
</html>
